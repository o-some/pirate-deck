name: Verify Asset Integrity V22 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-asset-integrity-v22-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: c720cfb0d12a45a4b3cbd80bacb0e6ecdf69c2cc
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: feat/asset-integrity-v22-20260821
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baseline
        working-directory: baseline
        run: |
          npm install
          npm run build

      - name: Verify clean candidate and build
        working-directory: candidate
        run: |
          set -euo pipefail
          node --check scripts/verify-asset-integrity.mjs
          npm install
          npm run build
          test ! -e public/card-monsters/monster-sprites-v1.webp
          test ! -e dist/card-monsters/monster-sprites-v1.webp
          test -s dist/pirate-deck-foundation-v17.css
          test -s dist/pirate-deck-runtime-v15.css
          test -s dist/pirate-deck-ui-runtime-v18.js

      - name: Verify guard rejects an orphan image
        working-directory: candidate
        run: |
          set -euo pipefail
          printf 'synthetic orphan asset\n' > public/card-monsters/orphan-test.webp
          if node scripts/verify-asset-integrity.mjs; then
            echo 'Asset guard incorrectly accepted orphan-test.webp'
            exit 1
          fi
          rm public/card-monsters/orphan-test.webp
          node scripts/verify-asset-integrity.mjs

      - name: Verify guard rejects a missing boss image
        working-directory: candidate
        run: |
          set -euo pipefail
          mv public/bosses/level-10-piratenkoenig-varkos.webp /tmp/level-10-piratenkoenig-varkos.webp
          if node scripts/verify-asset-integrity.mjs; then
            echo 'Asset guard incorrectly accepted missing boss image'
            exit 1
          fi
          mv /tmp/level-10-piratenkoenig-varkos.webp public/bosses/level-10-piratenkoenig-varkos.webp
          node scripts/verify-asset-integrity.mjs

      - name: Verify runtime and active assets unchanged
        run: |
          set -euo pipefail
          cmp baseline/dist/index.html candidate/dist/index.html
          cmp baseline/dist/pirate-deck-foundation-v17.css candidate/dist/pirate-deck-foundation-v17.css
          cmp baseline/dist/pirate-deck-runtime-v15.css candidate/dist/pirate-deck-runtime-v15.css
          cmp baseline/dist/pirate-deck-ui-runtime-v18.js candidate/dist/pirate-deck-ui-runtime-v18.js
          for f in pirate-deck.js pirate-deck-card-rules-v2.js pirate-deck-monster-cards-v1.js; do
            cmp "baseline/dist/$f" "candidate/dist/$f"
          done
          for f in \
            level-01-pirat-kai.webp level-02-kapitaen-brax.webp level-03-blackfinn.webp \
            level-04-alt-kapitaen-roderick.webp level-05-piratenbaron-vargas.webp level-06-kapitaen-ironhook.webp \
            level-07-admiral-thorne.webp level-08-kartenmeister-corvin.webp level-09-schattenfuerst-azrak.webp \
            level-10-piratenkoenig-varkos.webp; do
            cmp "baseline/dist/bosses/$f" "candidate/dist/bosses/$f"
          done
          for f in \
            01-neri-meereskundschafter.webp 02-pompi-apfelgeist.webp 03-wavi-wellengeist.webp \
            04-mira-herzhueterin.webp 05-soli-sonnengeist.webp 06-lexi-runengelehrter.webp \
            07-krax-sprintkrabbler.webp 08-moa-inselwaechter.webp; do
            cmp "baseline/dist/card-monsters/$f" "candidate/dist/card-monsters/$f"
          done
          cmp baseline/dist/card-monsters/manifest.json candidate/dist/card-monsters/manifest.json

      - name: Record verification on feature
        working-directory: candidate
        run: |
          cat > docs/ASSET_INTEGRITY_V22_VERIFIED.md <<'EOF'
          # Asset Integrity Guard V22 verification

          - Existing local game-asset audit: PASS
          - 10 boss runtime images present and mapped in order: PASS
          - 8 monster runtime images present and mapped to definitions: PASS
          - Monster manifest matches runtime assets: PASS
          - Orphan runtime images after cleanup: NONE
          - Obsolete monster-sprites-v1.webp removed: PASS
          - Guard syntax: PASS
          - Clean asset set accepted: PASS
          - Synthetic orphan image rejected: PASS
          - Synthetic missing boss image rejected: PASS
          - Astro production build: PASS
          - Runtime HTML/CSS/JS output unchanged: PASS
          - 18 active local runtime images unchanged: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ASSET_INTEGRITY_V22_VERIFIED.md
          git commit -m 'Record Asset Integrity V22 verification'
          git push origin HEAD:feat/asset-integrity-v22-20260821
