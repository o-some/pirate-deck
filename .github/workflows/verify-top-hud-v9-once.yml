name: Verify Top HUD V9 once

on:
  push:
    branches: [feat/top-hud-v9-20260821]
    paths:
      - '.github/workflows/verify-top-hud-v9-once.yml'
      - 'src/pages/index.astro'
      - 'public/pirate-deck-top-hud-v9.css'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax and production build
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-hud-hp-v4.js
          npm install
          npm run build
          test -s dist/pirate-deck-top-hud-v9.css
          grep -q 'pirate-deck-top-hud-v9.css' dist/index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify HUD hierarchy on representative viewports
        run: |
          set -euo pipefail
          mkdir -p .qa-root/pirate-deck
          cp -a dist/. .qa-root/pirate-deck/
          python3 -m http.server 4173 --directory .qa-root >/tmp/top-hud-v9.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const cases=[
            ['iphone-se',375,667,true],
            ['iphone',390,844,true],
            ['tablet',768,1024,true],
            ['desktop',1360,856,false]
          ];
          const assert=(cond,msg)=>{if(!cond)throw new Error(msg)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height,mobile] of cases){
              const ctx=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile});
              await ctx.addInitScript(()=>localStorage.setItem('pirateDeckGuideSeen','1'));
              const page=await ctx.newPage();
              await page.goto('http://127.0.0.1:4173/pirate-deck/',{waitUntil:'networkidle'});
              if(await page.locator('#start').isVisible().catch(()=>false)) await page.click('#start');
              if(await page.locator('#guideStart').isVisible().catch(()=>false)) await page.click('#guideStart');
              await page.waitForTimeout(300);
              const data=await page.evaluate(()=>{
                const box=s=>{const e=document.querySelector(s); if(!e)return null; const r=e.getBoundingClientRect(); return {l:r.left,r:r.right,t:r.top,b:r.bottom,w:r.width,h:r.height,display:getComputedStyle(e).display}};
                const generic=[...document.querySelectorAll('.battle-hud > .hud-stat')].find(e=>!e.classList.contains('hud-shells')&&!e.classList.contains('hud-boss-meta'));
                const genericBox=generic?(()=>{const r=generic.getBoundingClientRect();return{l:r.left,r:r.right,t:r.top,b:r.bottom,w:r.width,h:r.height}})():null;
                return {
                  hud:box('.battle-hud'),boss:box('.hud-boss-name'),shells:box('.hud-shells'),turn:box('.turn-medallion'),energy:genericBox,level:box('.hud-boss-level'),
                  bossTitle:box('.boss-info-strip h1'),progress:box('.boss-info-strip .boss-progress'),ribbon:box('.boss-info-strip .boss-ribbon'),taunt:box('.boss-info-strip #taunt'),
                  bossText:document.querySelector('.hud-boss-name b')?.textContent?.trim(),levelText:document.querySelector('.hud-boss-level b')?.textContent?.trim()
                };
              });
              for(const key of ['hud','boss','shells','turn','energy','level','taunt']) assert(data[key],`${name}: missing ${key}`);
              assert(data.boss.l < data.shells.l && data.shells.l < data.turn.l && data.turn.l < data.energy.l && data.energy.l < data.level.l,`${name}: wrong HUD order`);
              assert(data.boss.l >= data.hud.l-1 && data.level.r <= data.hud.r+1,`${name}: HUD content clipped horizontally`);
              const ordered=[data.boss,data.shells,data.turn,data.energy,data.level];
              for(let i=0;i<ordered.length-1;i++) assert(ordered[i].r <= ordered[i+1].l+2,`${name}: HUD cells overlap ${i}`);
              assert(data.bossTitle.display==='none',`${name}: duplicate boss title still visible`);
              assert(data.progress.display==='none',`${name}: duplicate boss progress still visible`);
              assert(data.ribbon.display==='none',`${name}: duplicate bossfight ribbon still visible`);
              assert(data.taunt.h <= 30,`${name}: taunt strip too tall (${data.taunt.h})`);
              assert(data.bossText && data.bossText.length>2,`${name}: boss name empty`);
              assert(/\d+\s*\/\s*10/.test(data.levelText||''),`${name}: level text invalid: ${data.levelText}`);
              console.log(`${name} PASS`,data.bossText,data.levelText);
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Record successful verification
        run: |
          cat > docs/TOP_HUD_V9_VERIFIED.md <<'EOF'
          # Top HUD V9 verification

          - Existing JavaScript syntax: PASS
          - Astro production build: PASS
          - Boss identity is leftmost HUD item: PASS
          - Boss level is rightmost HUD item: PASS
          - Shells / turn / wave energy stay between them: PASS
          - Duplicate lower boss name / level / bossfight ribbon hidden: PASS
          - Thin taunt/status strip retained: PASS
          - iPhone SE / iPhone / tablet / desktop HUD overlap QA: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/TOP_HUD_V9_VERIFIED.md
          git commit -m 'Record successful Top HUD V9 verification'
          git push
