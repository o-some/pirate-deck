name: Diagnose Live QA V8 post-fix once

on:
  push:
    branches: [feat/live-qa-v8-20260821]
    paths:
      - '.github/workflows/diagnose-live-qa-v8-postfix-once.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Measure fixed UI
        run: |
          set -euo pipefail
          mkdir -p .qa-root/pirate-deck docs
          cp -a dist/. .qa-root/pirate-deck/
          python3 -m http.server 4173 --directory .qa-root >/tmp/qa-v8-post.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const cases=[['iphone-se',375,667,true],['iphone',390,844,true],['laptop',1024,768,false],['desktop',1360,856,false]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const out=[];
            for(const [name,w,h,mobile] of cases){
              const ctx=await browser.newContext({viewport:{width:w,height:h},isMobile:mobile,hasTouch:mobile});
              await ctx.addInitScript(()=>localStorage.setItem('pirateDeckGuideSeen','1'));
              const page=await ctx.newPage();
              await page.goto('http://127.0.0.1:4173/pirate-deck/',{waitUntil:'networkidle'});
              if(await page.locator('#start').isVisible().catch(()=>false)) await page.click('#start');
              if(await page.locator('#guideStart').isVisible().catch(()=>false)) await page.click('#guideStart');
              await page.waitForTimeout(350);
              const r=await page.evaluate(()=>{
                const box=e=>{const x=e.getBoundingClientRect();return{l:x.left,t:x.top,r:x.right,b:x.bottom,w:x.width,h:x.height}};
                const cards=[...document.querySelectorAll('.monster-card')];
                const overlaps=[];
                cards.forEach((c,i)=>{
                  const parts=['.monster-art-frame','.monster-name','.monster-effect','.monster-stats','.monster-play-hint'].map(s=>c.querySelector(s)).filter(Boolean).map(box);
                  for(let j=0;j<parts.length-1;j++) if(parts[j].b>parts[j+1].t+2) overlaps.push(`card${i+1}:${j}`);
                });
                const end=document.querySelector('#endTurn'),route=document.querySelector('.boss-roster-section');
                const eb=end?box(end):null, rb=route?box(route):null;
                return{cardCount:cards.length,cardWidths:cards.map(c=>Math.round(c.getBoundingClientRect().width)),overlaps,endBottom:eb?Math.round(eb.b):null,routeTop:rb?Math.round(rb.t):null,viewport:innerHeight,doc:document.documentElement.scrollHeight};
              });
              out.push({name,...r});
              await ctx.close();
            }
            await browser.close();
            const lines=['# Live QA V8 post-fix',''];
            for(const x of out){
              lines.push(`## ${x.name}`,'',`- cards: ${x.cardCount}`,`- widths: ${x.cardWidths.join(', ')}`,`- internal overlaps: ${x.overlaps.length}`,`- end bottom: ${x.endBottom} / ${x.viewport}`,`- route top: ${x.routeTop}`,`- document height: ${x.doc}`,'');
            }
            fs.writeFileSync('docs/LIVE_QA_V8_POSTFIX.md',lines.join('\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/LIVE_QA_V8_POSTFIX.md
          git commit -m 'Record post-fix Live QA V8 report'
          git push

# retry-direct
