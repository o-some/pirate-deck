name: Verify and deploy Live QA V8 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-live-qa-v8-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify V8
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -s dist/pirate-deck-live-qa-fixes-v8.css
          grep -q 'pirate-deck-live-qa-fixes-v8.css' dist/index.html
          grep -q 'height:238px' dist/pirate-deck-live-qa-fixes-v8.css
          grep -q 'flex:0 0 clamp(170px,46vw,190px)' dist/pirate-deck-live-qa-fixes-v8.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V8 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/LIVE_QA_V8_PAGES_VERIFIED.md <<EOF
          # Live QA V8 Pages verification

          - Astro production build: PASS
          - V8 measured card fixes in build: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/LIVE_QA_V8_PAGES_VERIFIED.md
          git commit -m 'Record successful Live QA V8 Pages deployment'
          git push
