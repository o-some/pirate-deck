name: Localize boss assets once

on:
  push:
    paths:
      - '.github/workflows/localize-boss-assets-once.yml'

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite runtime to local boss WebPs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
            'bosses/level-01-pirat-kai.webp',
            'bosses/level-02-kapitaen-brax.webp',
            'bosses/level-03-blackfinn.webp',
            'bosses/level-04-alt-kapitaen-roderick.webp',
            'bosses/level-05-piratenbaron-vargas.webp',
            'bosses/level-06-kapitaen-ironhook.webp',
            'bosses/level-07-admiral-thorne.webp',
            'bosses/level-08-kartenmeister-corvin.webp',
            'bosses/level-09-schattenfuerst-azrak.webp',
            'bosses/level-10-piratenkoenig-varkos.webp',
          ]

          js_path = Path('public/pirate-deck.js')
          js = js_path.read_text()
          it = iter(files)
          js, count = re.subn(r"sprite:'[^']+'", lambda m: f"sprite:'{next(it)}'", js, count=10)
          if count != 10:
              raise SystemExit(f'Expected 10 boss sprite replacements, got {count}')
          js_path.write_text(js)

          astro_path = Path('src/pages/index.astro')
          astro = astro_path.read_text()
          old = "const assetRoot = 'https://raw.githubusercontent.com/o-some/tulasisland/main';\nconst kai = `${assetRoot}/public/letter-bay/bosses/level-01-pirat-kai.webp`;"
          new = "const kai = `${base}bosses/level-01-pirat-kai.webp`;"
          if old not in astro:
              raise SystemExit('Expected Kai asset declaration not found in index.astro')
          astro_path.write_text(astro.replace(old, new, 1))
          PY
      - name: Verify local runtime references
        run: |
          test -f public/bosses/level-01-pirat-kai.webp
          test -f public/bosses/level-10-piratenkoenig-varkos.webp
          ! grep -q 'dropboxusercontent.com' public/pirate-deck.js
      - name: Commit localized runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pirate-deck.js src/pages/index.astro
          git commit -m 'Use local boss WebP assets at runtime'
          git push
