name: QA Tactical Gameplay V30

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tactical multi-turn gameplay and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax-check tactical gameplay source
        run: node --check public/pirate-deck-gameplay-v30.js

      - name: Run V30 gameplay contract
        run: node scripts/verify-gameplay-v30.mjs

      - name: Remove one-time QA workflow from build workspace
        run: rm -f .github/workflows/qa-gameplay-v30.yml

      - name: Build and run full release guard chain
        run: npm run build

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high
