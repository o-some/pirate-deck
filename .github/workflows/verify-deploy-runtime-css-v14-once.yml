name: Verify and deploy Runtime CSS V14 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-runtime-css-v14-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: runtime-css-v14-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and build
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hud-hp-v4.js
          node --check public/pirate-deck-hand7-v5.js
          npm install
          npm run build
          test -s dist/pirate-deck-runtime-v14.css
          grep -q 'pirate-deck-runtime-v14.css' dist/index.html
          ! grep -q 'pirate-deck-hud-hp-v4.css' dist/index.html
          ! grep -q 'pirate-deck-hand7-v5.css' dist/index.html
          ! grep -q 'pirate-deck-mobile-balance-v6.css' dist/index.html
          ! grep -q 'pirate-deck-final-polish-v7.css' dist/index.html
          ! grep -q 'pirate-deck-release-v12.css' dist/index.html
          grep -q "@import url('./pirate-deck-hud-hp-v4.css')" dist/pirate-deck-runtime-v14.css
          grep -q "@import url('./pirate-deck-release-v12.css')" dist/pirate-deck-runtime-v14.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V14 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/RUNTIME_CSS_V14_PAGES_VERIFIED.md <<EOF
          # Runtime CSS V14 Pages verification

          - Astro production build: PASS
          - JavaScript syntax: PASS
          - Single V14 runtime entrypoint: PASS
          - V4/V5/V6/V7/V12 direct runtime links removed: PASS
          - V14 import order retained: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUNTIME_CSS_V14_PAGES_VERIFIED.md
          git commit -m 'Record successful Runtime CSS V14 Pages deployment'
          git push
