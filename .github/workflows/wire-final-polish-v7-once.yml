name: Wire Final Polish V7 once

on:
  push:
    branches: [feat/final-polish-v7-20260821]
    paths:
      - '.github/workflows/wire-final-polish-v7-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire final V7 stylesheet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/index.astro')
          text = path.read_text()
          anchor = '  <link rel="stylesheet" href={`${base}pirate-deck-mobile-balance-v6.css`} />\n'
          line = '  <link rel="stylesheet" href={`${base}pirate-deck-final-polish-v7.css`} />\n'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('V6 CSS anchor missing')
              text = text.replace(anchor, anchor + line, 1)
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/pages/index.astro
          git commit -m 'Wire final cross-device polish V7' || exit 0
          git push
