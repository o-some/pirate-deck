name: QA Gameplay Contract V26

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify gameplay contract and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare generated runtime
        run: npm run prepare:runtime

      - name: Verify runtime sources
        run: npm run verify:sources

      - name: Verify style sources
        run: npm run verify:styles

      - name: Verify assets
        run: npm run verify:assets

      - name: Verify gameplay contract
        run: npm run verify:gameplay

      - name: Build Astro output
        run: npx astro build
