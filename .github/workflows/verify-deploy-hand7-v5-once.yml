name: Verify and deploy Hand 7 V5 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-hand7-v5-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hand7-v5-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and build
        run: |
          set -euo pipefail
          node --check public/pirate-deck-hand7-v5.js
          grep -q 'let handLimit = 7' public/pirate-deck-hand7-v5.js
          npm install
          npm run build
          test -s dist/pirate-deck-hand7-v5.js
          test -s dist/pirate-deck-hand7-v5.css
          grep -q 'pirate-deck-hand7-v5.js' dist/index.html
          grep -q 'pirate-deck-hand7-v5.css' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Hand 7 V5 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/HAND7_V5_PAGES_VERIFIED.md <<EOF
          # Hand 7 / Card Readability V5 Pages verification

          - Astro production build: PASS
          - Hand 7 V5 CSS and JS in build: PASS
          - Configurable default hand limit 7 in build: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/HAND7_V5_PAGES_VERIFIED.md
          git commit -m 'Record successful Hand 7 V5 Pages deployment'
          git push
