name: QA Lockfile V29

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: Generate lockfile and verify reproducible build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package lock to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already up to date"
          else
            git commit -m "Add reproducible package lock V29"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Clean install from lockfile
        run: npm ci

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high

      - name: Remove one-time QA workflow from build workspace
        run: rm -f .github/workflows/qa-lockfile-v29.yml

      - name: Build and run all release guards
        run: npm run build
