name: Consolidate Release CSS V12 once

on:
  push:
    branches: [feat/css-consolidation-v12-20260821]
    paths:
      - '.github/workflows/consolidate-css-v12-once.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build consolidated release CSS
        run: |
          set -euo pipefail
          {
            printf '/* Pirate Deck — Consolidated Release CSS V12\n   Exact concatenation of V8 → V9 → V10 → V11. No visual changes intended. */\n\n'
            cat public/pirate-deck-live-qa-fixes-v8.css
            printf '\n\n'
            cat public/pirate-deck-top-hud-v9.css
            printf '\n\n'
            cat public/pirate-deck-interaction-polish-v10.css
            printf '\n\n'
            cat public/pirate-deck-battlefield-v11.css
          } > public/pirate-deck-release-v12.css

      - name: Replace four runtime links with one V12 link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/pages/index.astro')
          text=path.read_text()
          old='''  <link rel="stylesheet" href={`${base}pirate-deck-live-qa-fixes-v8.css`} />
  <link rel="stylesheet" href={`${base}pirate-deck-top-hud-v9.css`} />
  <link rel="stylesheet" href={`${base}pirate-deck-interaction-polish-v10.css`} />
  <link rel="stylesheet" href={`${base}pirate-deck-battlefield-v11.css`} />
'''
          new='  <link rel="stylesheet" href={`${base}pirate-deck-release-v12.css`} />\n'
          if old not in text:
              raise SystemExit('Expected V8-V11 stylesheet block not found')
          text=text.replace(old,new,1)
          path.write_text(text)
          PY

      - name: Verify exact source concatenation order
        run: |
          set -euo pipefail
          grep -q 'Live QA V8' public/pirate-deck-release-v12.css
          grep -q 'Top HUD V9' public/pirate-deck-release-v12.css
          grep -q 'Interaction Polish V10' public/pirate-deck-release-v12.css
          grep -q 'Battlefield Readability V11' public/pirate-deck-release-v12.css
          test "$(grep -c 'pirate-deck-release-v12.css' src/pages/index.astro)" -eq 1
          test "$(grep -c 'pirate-deck-live-qa-fixes-v8.css' src/pages/index.astro)" -eq 0
          test "$(grep -c 'pirate-deck-top-hud-v9.css' src/pages/index.astro)" -eq 0
          test "$(grep -c 'pirate-deck-interaction-polish-v10.css' src/pages/index.astro)" -eq 0
          test "$(grep -c 'pirate-deck-battlefield-v11.css' src/pages/index.astro)" -eq 0

      - name: Commit consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/pirate-deck-release-v12.css src/pages/index.astro
          git commit -m 'Consolidate release CSS into V12'
          git push
