name: Build and verify Foundation CSS V17 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-verify-foundation-v17-once.yml'

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/foundation-css-v17-20260821
          path: candidate
          fetch-depth: 0
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: 9855e56ccd4c4de22a1f656b52f21813db8e7ea4
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build exact foundation CSS
        working-directory: candidate
        run: |
          set -euo pipefail
          files=(pirate-deck.css pirate-deck-mobile.css pirate-deck-card-polish.css pirate-deck-ci-pass.css pirate-deck-mobile-final.css pirate-deck-desktop-fit.css pirate-deck-cards-toast.css pirate-deck-card-ui-v2.css pirate-deck-hand-premium-v3.css pirate-deck-guide-v1.css pirate-deck-monster-cards-v1.css pirate-deck-battle-layout-v3.css)
          { printf '/* Pirate Deck — Foundation CSS V17\n   Exact concatenation of the 12 pre-V15 runtime stylesheets. No visual changes intended. */\n\n'; for f in "${files[@]}"; do printf '\n/* ===== %s ===== */\n' "$f"; cat "public/$f"; printf '\n'; done; } > public/pirate-deck-foundation-v17.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/index.astro'); text=p.read_text()
          files=['pirate-deck.css','pirate-deck-mobile.css','pirate-deck-card-polish.css','pirate-deck-ci-pass.css','pirate-deck-mobile-final.css','pirate-deck-desktop-fit.css','pirate-deck-cards-toast.css','pirate-deck-card-ui-v2.css','pirate-deck-hand-premium-v3.css','pirate-deck-guide-v1.css','pirate-deck-monster-cards-v1.css','pirate-deck-battle-layout-v3.css']
          old=''.join(f'  <link rel="stylesheet" href={{`${{base}}{f}`}} />\n' for f in files)
          new='  <link rel="stylesheet" href={`${base}pirate-deck-foundation-v17.css`} />\n'
          if old not in text: raise SystemExit('Expected 12-link foundation block not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Build baseline and candidate
        run: |
          set -euo pipefail
          cd baseline && npm install && npm run build
          cd ../candidate && npm install && npm run build
          test -s dist/pirate-deck-foundation-v17.css
          test -s dist/pirate-deck-runtime-v15.css
          grep -q 'pirate-deck-foundation-v17.css' dist/index.html
          grep -q 'pirate-deck-runtime-v15.css' dist/index.html
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hud-hp-v4.js
          node --check public/pirate-deck-hand7-v5.js
      - name: Install browser QA
        run: |
          mkdir qa && cd qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify rendered parity
        run: |
          set -euo pipefail
          mkdir -p .serve-base/pirate-deck .serve-candidate/pirate-deck
          cp -a baseline/dist/. .serve-base/pirate-deck/
          cp -a candidate/dist/. .serve-candidate/pirate-deck/
          python3 -m http.server 4173 --directory .serve-base >/tmp/pd-v17-base.log 2>&1 & P1=$!
          python3 -m http.server 4174 --directory .serve-candidate >/tmp/pd-v17-candidate.log 2>&1 & P2=$!
          trap 'kill $P1 $P2 || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('./qa/node_modules/playwright');
          const cases=[['iphone-se',375,667,true],['iphone',390,844,true],['tablet',768,1024,true],['desktop',1360,856,false]];
          const selectors=['.game-header','.battle-hud','.boss-info-strip','.enemy-field.enemy-stage','.player-stage','.hand','.monster-card','.monster-cost','.monster-name','.monster-effect','.monster-stats','.end','.character-health','.boss-roster-section'];
          const props=['display','position','width','height','minWidth','minHeight','maxWidth','maxHeight','paddingTop','paddingRight','paddingBottom','paddingLeft','marginTop','marginRight','marginBottom','marginLeft','gap','rowGap','columnGap','gridTemplateColumns','gridTemplateRows','alignItems','justifyContent','overflow','overflowX','overflowY','borderRadius','fontSize','lineHeight','color','backgroundColor','opacity','transform'];
          async function snap(page){return page.evaluate(({selectors,props})=>{const out={};for(const s of selectors){const el=document.querySelector(s);if(!el){out[s]=null;continue;}const r=el.getBoundingClientRect(),cs=getComputedStyle(el),style={};for(const p of props)style[p]=cs[p];out[s]={rect:{x:r.x,y:r.y,w:r.width,h:r.height},style};}out.cardCount=document.querySelectorAll('.monster-card').length;return out;},{selectors,props});}
          function cmp(a,b,n){const e=[];if(a.cardCount!==b.cardCount)e.push(n+': card count');for(const s of selectors){if(!a[s]||!b[s]){if(Boolean(a[s])!==Boolean(b[s]))e.push(n+': '+s+' presence');continue;}for(const k of ['x','y','w','h'])if(Math.abs(a[s].rect[k]-b[s].rect[k])>.6)e.push(n+': '+s+' rect '+k);for(const p of props)if(a[s].style[p]!==b[s].style[p])e.push(n+': '+s+' '+p);}return e;}
          (async()=>{const browser=await chromium.launch({headless:true});const all=[];for(const [n,w,h,m] of cases){async function load(port){const ctx=await browser.newContext({viewport:{width:w,height:h},isMobile:m,hasTouch:m});await ctx.addInitScript(()=>{localStorage.setItem('pirateDeckGuideSeen','1');localStorage.setItem('pirate-deck-guide-seen','1');});const page=await ctx.newPage();await page.goto(`http://127.0.0.1:${port}/pirate-deck/`,{waitUntil:'networkidle'});if(await page.locator('#start').isVisible().catch(()=>false))await page.click('#start');if(await page.locator('#guideStart').isVisible().catch(()=>false))await page.click('#guideStart');await page.waitForTimeout(300);const s=await snap(page);await ctx.close();return s;}const errs=cmp(await load(4173),await load(4174),n);console.log(n,errs.length?'FAIL':'PASS');all.push(...errs);}await browser.close();if(all.length){console.error(all.join('\n'));process.exit(1);}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Record and commit verified candidate
        working-directory: candidate
        run: |
          cat > docs/FOUNDATION_V17_PARITY_VERIFIED.md <<'EOF'
          # Foundation CSS V17 parity verification

          - Baseline Astro build: PASS
          - Candidate Astro build: PASS
          - 12 direct foundation stylesheet links replaced by one V17 link: PASS
          - Runtime V15 remains separate and unchanged: PASS
          - iPhone SE rendered parity: PASS
          - iPhone rendered parity: PASS
          - Tablet rendered parity: PASS
          - Desktop rendered parity: PASS
          - Gameplay JavaScript syntax: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pirate-deck-foundation-v17.css src/pages/index.astro docs/FOUNDATION_V17_PARITY_VERIFIED.md
          git commit -m 'Consolidate foundation CSS into V17'
          git push origin HEAD:feat/foundation-css-v17-20260821

# retry-trigger
