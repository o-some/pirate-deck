name: Build CSS V12 feature once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-css-v12-feature-once.yml'

permissions:
  contents: write

jobs:
  build-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/css-consolidation-v12-20260821
          fetch-depth: 0
      - name: Consolidate V8 through V11
        run: |
          set -euo pipefail
          {
            printf '/* Pirate Deck — Consolidated Release CSS V12\n   Exact concatenation of V8 → V9 → V10 → V11. No visual changes intended. */\n\n'
            cat public/pirate-deck-live-qa-fixes-v8.css
            printf '\n\n'
            cat public/pirate-deck-top-hud-v9.css
            printf '\n\n'
            cat public/pirate-deck-interaction-polish-v10.css
            printf '\n\n'
            cat public/pirate-deck-battlefield-v11.css
          } > public/pirate-deck-release-v12.css

          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/pages/index.astro')
          text=path.read_text()
          old='''  <link rel="stylesheet" href={`${base}pirate-deck-live-qa-fixes-v8.css`} />
  <link rel="stylesheet" href={`${base}pirate-deck-top-hud-v9.css`} />
  <link rel="stylesheet" href={`${base}pirate-deck-interaction-polish-v10.css`} />
  <link rel="stylesheet" href={`${base}pirate-deck-battlefield-v11.css`} />
'''
          new='  <link rel="stylesheet" href={`${base}pirate-deck-release-v12.css`} />\n'
          if old not in text:
              raise SystemExit('Expected V8-V11 block not found')
          path.write_text(text.replace(old,new,1))
          PY

      - name: Commit feature result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/pirate-deck-release-v12.css src/pages/index.astro
          git commit -m 'Consolidate release CSS into V12' || exit 0
          git push origin HEAD:feat/css-consolidation-v12-20260821
