name: Verify Dead Assets V19 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-dead-assets-v19-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: 800f245092f8859692f5772d367c867cbbdccafc
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: feat/dead-assets-v19-20260821
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build baseline
        working-directory: baseline
        run: |
          npm install
          npm run build
      - name: Build candidate and verify removals
        working-directory: candidate
        run: |
          set -euo pipefail
          npm install
          npm run build
          for f in boss-roster.css pirate-deck-board-v4.css pirat-kai.svg; do
            test ! -e "public/$f"
            test ! -e "dist/$f"
          done
          node --check dist/pirate-deck-ui-runtime-v18.js
      - name: Verify runtime output unchanged
        run: |
          set -euo pipefail
          cmp baseline/dist/index.html candidate/dist/index.html
          cmp baseline/dist/pirate-deck-foundation-v17.css candidate/dist/pirate-deck-foundation-v17.css
          cmp baseline/dist/pirate-deck-runtime-v15.css candidate/dist/pirate-deck-runtime-v15.css
          cmp baseline/dist/pirate-deck-ui-runtime-v18.js candidate/dist/pirate-deck-ui-runtime-v18.js
          for f in pirate-deck.js pirate-deck-card-rules-v2.js pirate-deck-monster-cards-v1.js; do
            cmp "baseline/dist/$f" "candidate/dist/$f"
          done
      - name: Record success on feature
        working-directory: candidate
        run: |
          cat > docs/DEAD_ASSETS_V19_VERIFIED.md <<'EOF'
          # Dead Assets V19 verification

          - Baseline Astro build: PASS
          - Candidate Astro build: PASS
          - Runtime index.html unchanged: PASS
          - Foundation V17 unchanged: PASS
          - Runtime V15 unchanged: PASS
          - UI Runtime V18 unchanged: PASS
          - Core gameplay/card/monster JavaScript unchanged: PASS
          - boss-roster.css removed: PASS
          - pirate-deck-board-v4.css removed: PASS
          - pirat-kai.svg removed: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DEAD_ASSETS_V19_VERIFIED.md
          git commit -m 'Record Dead Assets V19 verification'
          git push origin HEAD:feat/dead-assets-v19-20260821
