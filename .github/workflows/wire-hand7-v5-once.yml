name: Wire Hand 7 V5 once

on:
  push:
    branches: [feat/hand7-cards-v5-20260821]
    paths:
      - '.github/workflows/wire-hand7-v5-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire final hand CSS and JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/index.astro')
          text = path.read_text()
          css_anchor = '  <link rel="stylesheet" href={`${base}pirate-deck-hud-hp-v4.css`} />\n'
          css_line = '  <link rel="stylesheet" href={`${base}pirate-deck-hand7-v5.css`} />\n'
          js_anchor = '  <script src={`${base}pirate-deck-hud-hp-v4.js`} defer></script>\n'
          js_line = '  <script src={`${base}pirate-deck-hand7-v5.js`} defer></script>\n'
          if css_line not in text:
              if css_anchor not in text: raise SystemExit('CSS anchor missing')
              text = text.replace(css_anchor, css_anchor + css_line, 1)
          if js_line not in text:
              if js_anchor not in text: raise SystemExit('JS anchor missing')
              text = text.replace(js_anchor, js_anchor + js_line, 1)
          path.write_text(text)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/pages/index.astro
          git commit -m 'Wire seven-card hand UI' || exit 0
          git push
