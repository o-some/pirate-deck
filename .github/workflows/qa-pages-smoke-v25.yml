name: QA Pages Smoke V25

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove one-time QA workflow from workspace
        run: rm .github/workflows/qa-pages-smoke-v25.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check smoke verifier syntax
        run: node --check scripts/verify-pages-deploy.mjs

      - name: Build production site
        run: npm run build

      - name: Validate current live Pages payload
        run: npm run verify:pages -- https://o-some.github.io/pirate-deck/
