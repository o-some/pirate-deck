name: Verify Source CSS Cleanup V16 once

on:
  push:
    branches: [feat/source-css-cleanup-v16-20260821]
    paths:
      - '.github/workflows/verify-source-css-v16-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: feat/source-css-cleanup-v16-20260821
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build baseline
        working-directory: baseline
        run: |
          set -euo pipefail
          npm install
          npm run build
      - name: Build candidate and verify cleanup
        working-directory: candidate
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hud-hp-v4.js
          node --check public/pirate-deck-hand7-v5.js
          npm install
          npm run build
          test -s dist/pirate-deck-runtime-v15.css
          grep -q 'pirate-deck-runtime-v15.css' dist/index.html
          for f in \
            pirate-deck-hud-hp-v4.css \
            pirate-deck-hand7-v5.css \
            pirate-deck-mobile-balance-v6.css \
            pirate-deck-final-polish-v7.css \
            pirate-deck-release-v12.css \
            pirate-deck-runtime-v14.css; do
            test ! -e "public/$f"
            test ! -e "dist/$f"
            ! grep -q "$f" dist/index.html
          done
      - name: Verify runtime parity
        run: |
          set -euo pipefail
          cmp baseline/dist/index.html candidate/dist/index.html
          cmp baseline/dist/pirate-deck-runtime-v15.css candidate/dist/pirate-deck-runtime-v15.css
          for f in \
            pirate-deck.js \
            pirate-deck-card-rules-v2.js \
            pirate-deck-monster-cards-v1.js \
            pirate-deck-asset-guard.js \
            pirate-deck-info-toast.js \
            pirate-deck-guide-v1.js \
            pirate-deck-hud-hp-v4.js \
            pirate-deck-hand7-v5.js; do
            cmp "baseline/dist/$f" "candidate/dist/$f"
          done
      - name: Record verification
        working-directory: candidate
        run: |
          cat > docs/SOURCE_CSS_V16_VERIFIED.md <<'EOF'
          # Source CSS Cleanup V16 verification

          - Baseline main Astro build: PASS
          - Candidate Astro build: PASS
          - JavaScript syntax: PASS
          - Runtime V15 retained unchanged: PASS
          - Built index.html unchanged: PASS
          - Core JavaScript build artifacts unchanged: PASS
          - Superseded V4/V5/V6/V7/V12/V14 CSS files removed: PASS
          - Runtime references to removed CSS files: NONE
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SOURCE_CSS_V16_VERIFIED.md
          git commit -m 'Record successful Source CSS V16 verification'
          git push origin HEAD:feat/source-css-cleanup-v16-20260821
