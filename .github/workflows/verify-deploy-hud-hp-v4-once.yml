name: Verify and deploy HUD HP V4 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-hud-hp-v4-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hud-hp-v4-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and build
        run: |
          set -euo pipefail
          node --check public/pirate-deck-hud-hp-v4.js
          npm install
          npm run build
          test -s dist/pirate-deck-hud-hp-v4.css
          test -s dist/pirate-deck-hud-hp-v4.js
          grep -q 'pirate-deck-hud-hp-v4.css' dist/index.html
          grep -q 'pirate-deck-hud-hp-v4.js' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified HUD HP V4 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/HUD_HP_V4_PAGES_VERIFIED.md <<EOF
          # HUD / Character HP V4 Pages verification

          - Astro production build: PASS
          - HUD / HP V4 CSS and JS in build: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HUD_HP_V4_PAGES_VERIFIED.md
          git commit -m 'Record successful HUD HP V4 Pages deployment'
          git push
