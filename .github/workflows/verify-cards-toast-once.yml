name: Verify cards and info toast once

on:
  push:
    branches:
      - fix/cards-info-toast-20260820
    paths:
      - '.github/workflows/verify-cards-toast-once.yml'
      - 'src/pages/index.astro'
      - 'public/pirate-deck-cards-toast.css'
      - 'public/pirate-deck-info-toast.js'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        run: |
          npm install
          node --check public/pirate-deck-info-toast.js
          npm run build
      - name: Verify wiring
        run: |
          test -s dist/pirate-deck-cards-toast.css
          test -s dist/pirate-deck-info-toast.js
          grep -q 'pirate-deck-cards-toast.css' src/pages/index.astro
          grep -q 'pirate-deck-info-toast.js' src/pages/index.astro
          grep -q 'id="infoToast"' src/pages/index.astro
          grep -q 'id="log"' src/pages/index.astro
      - name: Record successful verification
        run: |
          cat > docs/CARDS_TOAST_VERIFIED.md <<'EOF'
          # Pirate Deck cards + info toast verification

          - Astro build: PASS
          - Info toast JavaScript syntax: PASS
          - CSS present in dist: PASS
          - Info toast JavaScript present in dist: PASS
          - DOM/CSS/JS wiring: PASS
          - Auto-minimize delay configured: 1500 ms
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CARDS_TOAST_VERIFIED.md
          git commit -m 'Record successful cards and info toast verification'
          git push
