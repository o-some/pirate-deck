name: Verify Live QA V8 once

on:
  push:
    branches: [feat/live-qa-v8-20260821]
    paths:
      - '.github/workflows/verify-live-qa-v8-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax and production build
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hand7-v5.js
          node --check public/pirate-deck-hud-hp-v4.js
          npm install
          npm run build
      - name: Verify measured fixes in build
        run: |
          set -euo pipefail
          test -s dist/pirate-deck-live-qa-fixes-v8.css
          grep -q 'pirate-deck-live-qa-fixes-v8.css' dist/index.html
          grep -q 'flex:0 0 clamp(170px,46vw,190px)' public/pirate-deck-live-qa-fixes-v8.css
          grep -q 'height:238px' public/pirate-deck-live-qa-fixes-v8.css
          grep -q 'grid-template-rows:22px minmax(0,1fr) 38px 44px 40px 14px' public/pirate-deck-live-qa-fixes-v8.css
          grep -q 'margin-top:28px' public/pirate-deck-live-qa-fixes-v8.css
          grep -q 'object-fit:contain' public/pirate-deck-live-qa-fixes-v8.css
      - name: Record verification
        run: |
          cat > docs/LIVE_QA_V8_VERIFIED.md <<'EOF'
          # Live QA V8 verification

          - Existing JavaScript syntax: PASS
          - Astro production build: PASS
          - V8 final CSS layer in build: PASS
          - Card row containment rules: PASS
          - Mobile fixed-width swipe cards: PASS
          - Short-phone viewport compression rules: PASS
          - Boss route separation rules: PASS
          - Centered contain artwork rules: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/LIVE_QA_V8_VERIFIED.md
          git commit -m 'Record successful Live QA V8 verification'
          git push
