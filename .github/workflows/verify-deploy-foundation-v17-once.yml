name: Verify and deploy Foundation V17 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-foundation-v17-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: foundation-v17-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify Foundation V17
        run: |
          set -euo pipefail
          node --check scripts/build-foundation-css.mjs
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          npm install
          npm run build
          test -s dist/pirate-deck-foundation-v17.css
          test -s dist/pirate-deck-runtime-v15.css
          grep -q 'pirate-deck-foundation-v17.css' dist/index.html
          grep -q 'pirate-deck-runtime-v15.css' dist/index.html
          test "$(grep -o 'rel=\"stylesheet\"' dist/index.html | wc -l)" -eq 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Foundation V17 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/FOUNDATION_V17_PAGES_VERIFIED.md <<EOF
          # Foundation CSS V17 Pages verification

          - Astro production build: PASS
          - Foundation generator: PASS
          - Foundation V17 in build: PASS
          - Runtime V15 retained: PASS
          - Runtime stylesheet requests reduced to 2: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FOUNDATION_V17_PAGES_VERIFIED.md
          git commit -m 'Record successful Foundation V17 Pages deployment'
          git push
