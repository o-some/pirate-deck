name: Verify and deploy Runtime V15 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-runtime-v15-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: runtime-v15-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify V15
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hand7-v5.js
          node --check public/pirate-deck-hud-hp-v4.js
          npm install
          npm run build
          test -s dist/pirate-deck-runtime-v15.css
          grep -q 'pirate-deck-runtime-v15.css' dist/index.html
          ! grep -q 'pirate-deck-runtime-v14.css' dist/index.html
          test "$(grep -c '^@import' public/pirate-deck-runtime-v15.css || true)" -eq 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V15 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/RUNTIME_V15_PAGES_VERIFIED.md <<EOF
          # Runtime CSS V15 Pages verification

          - Astro production build: PASS
          - JavaScript syntax: PASS
          - Self-contained V15 runtime stylesheet: PASS
          - V15 has no @import dependencies: PASS
          - V14 direct runtime link removed: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUNTIME_V15_PAGES_VERIFIED.md
          git commit -m 'Record successful Runtime V15 Pages deployment'
          git push
