name: Verify Battlefield Readability V11 once

on:
  push:
    branches: [feat/battlefield-readability-v11-20260821]
    paths:
      - '.github/workflows/verify-battlefield-v11-once.yml'
      - 'src/pages/index.astro'
      - 'public/pirate-deck-battlefield-v11.css'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax and production build
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          npm install
          npm run build
          test -s dist/pirate-deck-battlefield-v11.css
          grep -q 'pirate-deck-battlefield-v11.css' dist/index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure filled battlefield slots
        run: |
          set -euo pipefail
          mkdir -p .qa-root/pirate-deck
          cp -a dist/. .qa-root/pirate-deck/
          python3 -m http.server 4173 --directory .qa-root >/tmp/battlefield-v11.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium }=require('playwright');
          const cases=[['iphone',390,844,true],['tablet',768,1024,true],['desktop',1360,856,false]];
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height,mobile] of cases){
              const ctx=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile});
              await ctx.addInitScript(()=>{
                localStorage.setItem('pirateDeckGuideSeen','1');
                localStorage.setItem('pirate-deck-guide-seen','1');
              });
              const page=await ctx.newPage();
              await page.goto('http://127.0.0.1:4173/pirate-deck/',{waitUntil:'networkidle'});
              if(await page.locator('#start').isVisible().catch(()=>false)) await page.click('#start');
              if(await page.locator('#guideStart').isVisible().catch(()=>false)) await page.click('#guideStart');
              await page.waitForTimeout(300);
              await page.evaluate(()=>{
                const imgs=['card-monsters/01-neri-meereskundschafter.webp','card-monsters/02-pompi-apfelgeist.webp','card-monsters/03-wavi-wellengeist.webp'];
                const names=[['Neri','Meereskundschafter',3,4],['Pompi','Apfelgeist',2,3],['Wavi','Wellengeist',4,2]];
                document.querySelector('#playerLanes').innerHTML=names.map((x,i)=>`<div class="slot unit monster-unit"><div class="unit-card-inner"><img class="unit-monster-img" src="${imgs[i]}" alt=""><div class="unit-card-copy"><b>${x[0]}</b><small>${x[1]}</small><span><em>⚔ ${x[2]}</em><em>🛡 ${x[3]}</em></span></div></div></div>`).join('');
                document.querySelector('#enemyLanes').innerHTML=[['Matrose',2,3],['Kanoniere',3,2],['Deckwache',2,4]].map(x=>`<div class="slot unit enemy-unit"><div class="unit-card-copy"><b>🏴‍☠️ ${x[0]}</b><span><em>⚔ ${x[1]}</em><em>🛡 ${x[2]}</em></span></div></div>`).join('');
              });
              await page.waitForTimeout(250);
              const data=await page.evaluate(()=>{
                const box=e=>{const r=e.getBoundingClientRect();return{l:r.left,t:r.top,r:r.right,b:r.bottom,w:r.width,h:r.height}};
                const within=(a,b)=>a.l>=b.l-1&&a.r<=b.r+1&&a.t>=b.t-1&&a.b<=b.b+1;
                const players=[...document.querySelectorAll('#playerLanes .slot')].map(s=>({slot:box(s),inner:s.querySelector('.unit-card-inner')?box(s.querySelector('.unit-card-inner')):null,img:s.querySelector('.unit-monster-img')?box(s.querySelector('.unit-monster-img')):null,copy:s.querySelector('.unit-card-copy')?box(s.querySelector('.unit-card-copy')):null,fit:s.querySelector('.unit-monster-img')?getComputedStyle(s.querySelector('.unit-monster-img')).objectFit:null}));
                const enemies=[...document.querySelectorAll('#enemyLanes .slot')].map(s=>({slot:box(s),copy:s.querySelector('.unit-card-copy')?box(s.querySelector('.unit-card-copy')):null}));
                const end=box(document.querySelector('#endTurn'));
                const cards=[...document.querySelectorAll('.monster-card')];
                return{players,enemies,end,viewport:innerHeight,handCards:cards.length,within:players.map(x=>({inner:x.inner?within(x.inner,x.slot):false,img:x.img?within(x.img,x.slot):false,copy:x.copy?within(x.copy,x.slot):false})),enemyWithin:enemies.map(x=>x.copy?within(x.copy,x.slot):false)};
              });
              assert(data.players.length===3,`${name}: player slot count`);
              assert(data.enemies.length===3,`${name}: enemy slot count`);
              assert(data.handCards===7,`${name}: hand changed from seven cards`);
              const pw=data.players.map(x=>Math.round(x.slot.w));
              const ew=data.enemies.map(x=>Math.round(x.slot.w));
              assert(Math.max(...pw)-Math.min(...pw)<=2,`${name}: uneven player slot widths ${pw}`);
              assert(Math.max(...ew)-Math.min(...ew)<=2,`${name}: uneven enemy slot widths ${ew}`);
              data.within.forEach((x,i)=>{assert(x.inner&&x.img&&x.copy,`${name}: player slot ${i+1} clips content`);});
              data.enemyWithin.forEach((x,i)=>assert(x,`${name}: enemy slot ${i+1} clips copy`));
              data.players.forEach((x,i)=>assert(x.fit==='contain',`${name}: player image ${i+1} fit ${x.fit}`));
              assert(data.end.b<=data.viewport+1,`${name}: end turn below viewport ${data.end.b}/${data.viewport}`);
              console.log(`${name} PASS`,pw,ew,Math.round(data.end.b));
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Record successful verification
        run: |
          cat > docs/BATTLEFIELD_V11_VERIFIED.md <<'EOF'
          # Battlefield Readability V11 verification

          - Existing JavaScript syntax: PASS
          - Astro production build: PASS
          - V11 final CSS layer included: PASS
          - Three player slots keep equal geometry: PASS
          - Three enemy slots keep equal geometry: PASS
          - Played monster portrait/copy remain inside slots: PASS
          - Played monster art uses contain + centered positioning: PASS
          - Attack/defense chips stay inside unit copy: PASS
          - Seven-card hand remains unchanged: PASS
          - End-turn remains inside initial viewport: PASS
          - iPhone / tablet / desktop battlefield QA: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/BATTLEFIELD_V11_VERIFIED.md
          git commit -m 'Record successful Battlefield V11 verification'
          git push

# retry-trigger
