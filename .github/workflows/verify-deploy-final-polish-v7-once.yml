name: Verify and deploy Final Polish V7 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-final-polish-v7-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: final-polish-v7-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify V7
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -s dist/pirate-deck-final-polish-v7.css
          grep -q 'pirate-deck-final-polish-v7.css' dist/index.html
          grep -q 'object-fit:contain' dist/pirate-deck-final-polish-v7.css
          grep -q 'min-width:44px' dist/pirate-deck-final-polish-v7.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V7 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/FINAL_POLISH_V7_PAGES_VERIFIED.md <<EOF
          # Final Cross-Device Polish V7 Pages verification

          - Astro production build: PASS
          - V7 CSS in build: PASS
          - Centered asset / tap target rules in build: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/FINAL_POLISH_V7_PAGES_VERIFIED.md
          git commit -m 'Record successful Final Polish V7 Pages deployment'
          git push

# retry-trigger
