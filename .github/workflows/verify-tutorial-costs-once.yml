name: Verify tutorial and card costs once

on:
  push:
    branches:
      - feat/tutorial-costs-20260820
    paths:
      - '.github/workflows/verify-tutorial-costs-once.yml'
      - 'src/pages/index.astro'
      - 'public/pirate-deck-guide-v1.css'
      - 'public/pirate-deck-guide-v1.js'
      - 'public/pirate-deck-card-rules-v2.js'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify JavaScript
        run: |
          node --check public/pirate-deck-guide-v1.js
          node --check public/pirate-deck-card-rules-v2.js
      - name: Build Astro
        run: |
          npm install
          npm run build
      - name: Verify output wiring
        run: |
          test -s dist/pirate-deck-guide-v1.css
          test -s dist/pirate-deck-guide-v1.js
          grep -q 'gameGuide' dist/index.html
          grep -q 'Wellenkraft' dist/index.html
          grep -q 'pirate-deck-guide-v1.js' dist/index.html
