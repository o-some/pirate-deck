name: Verify and deploy CSS V12 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-css-v12-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: css-v12-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify V12
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hand7-v5.js
          npm install
          npm run build
          test -s dist/pirate-deck-release-v12.css
          grep -q 'pirate-deck-release-v12.css' dist/index.html
          ! grep -q 'pirate-deck-live-qa-fixes-v8.css' dist/index.html
          ! grep -q 'pirate-deck-top-hud-v9.css' dist/index.html
          ! grep -q 'pirate-deck-interaction-polish-v10.css' dist/index.html
          ! grep -q 'pirate-deck-battlefield-v11.css' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V12 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/CSS_V12_PAGES_VERIFIED.md <<EOF
          # Consolidated CSS V12 Pages verification

          - Astro production build: PASS
          - JavaScript syntax: PASS
          - Single V12 runtime stylesheet: PASS
          - V8/V9/V10/V11 direct runtime links removed: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CSS_V12_PAGES_VERIFIED.md
          git commit -m 'Record successful CSS V12 Pages deployment'
          git push
