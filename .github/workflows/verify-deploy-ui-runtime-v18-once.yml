name: Verify and deploy UI Runtime V18 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-ui-runtime-v18-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify and build
        run: |
          set -euo pipefail
          node --check scripts/build-ui-runtime.mjs
          npm run build
          node --check dist/pirate-deck-ui-runtime-v18.js
          grep -q 'pirate-deck-ui-runtime-v18.js' dist/index.html
          test "$(grep -o '<script ' dist/index.html | wc -l)" -eq 4
          for f in pirate-deck-asset-guard.js pirate-deck-info-toast.js pirate-deck-guide-v1.js pirate-deck-hud-hp-v4.js pirate-deck-hand7-v5.js; do
            ! grep -q "src=\"/pirate-deck/$f\"" dist/index.html
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record successful release
        run: |
          cat > docs/UI_RUNTIME_V18_PAGES_VERIFIED.md <<'EOF'
          # UI Runtime V18 Pages verification

          - Astro production build: PASS
          - UI Runtime V18 generator: PASS
          - Generated V18 JavaScript syntax: PASS
          - Runtime script requests reduced from 8 to 4: PASS
          - Five legacy UI direct script links removed: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: `0946c0195d88130a76558b3330df18ed9600b53c`
          - Page URL: https://o-some.github.io/pirate-deck/
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/UI_RUNTIME_V18_PAGES_VERIFIED.md
          git commit -m 'Record successful UI Runtime V18 Pages deployment'
          git push

# retry-trigger
