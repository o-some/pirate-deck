name: Verify and deploy Source CSS V16 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-source-css-v16-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: source-css-v16-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify V16 cleanup
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hud-hp-v4.js
          node --check public/pirate-deck-hand7-v5.js
          npm install
          npm run build
          test -s dist/pirate-deck-runtime-v15.css
          grep -q 'pirate-deck-runtime-v15.css' dist/index.html
          for f in pirate-deck-hud-hp-v4.css pirate-deck-hand7-v5.css pirate-deck-mobile-balance-v6.css pirate-deck-final-polish-v7.css pirate-deck-release-v12.css pirate-deck-runtime-v14.css; do
            test ! -e "public/$f"
            test ! -e "dist/$f"
            ! grep -q "$f" dist/index.html
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V16 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/SOURCE_CSS_V16_PAGES_VERIFIED.md <<EOF
          # Source CSS Cleanup V16 Pages verification

          - Astro production build: PASS
          - JavaScript syntax: PASS
          - Runtime V15 retained: PASS
          - Superseded V4/V5/V6/V7/V12/V14 CSS files absent: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SOURCE_CSS_V16_PAGES_VERIFIED.md
          git commit -m 'Record successful Source CSS V16 Pages deployment'
          git push

# retry-trigger
