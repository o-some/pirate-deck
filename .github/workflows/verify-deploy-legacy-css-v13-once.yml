name: Verify and deploy Legacy CSS V13 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-legacy-css-v13-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: legacy-css-v13-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify cleanup and build
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hud-hp-v4.js
          node --check public/pirate-deck-hand7-v5.js
          test -s public/pirate-deck-release-v12.css
          test ! -e public/pirate-deck-live-qa-fixes-v8.css
          test ! -e public/pirate-deck-top-hud-v9.css
          test ! -e public/pirate-deck-interaction-polish-v10.css
          test ! -e public/pirate-deck-battlefield-v11.css
          grep -q 'pirate-deck-release-v12.css' src/pages/index.astro
          npm install
          npm run build
          test -s dist/pirate-deck-release-v12.css
          grep -q 'pirate-deck-release-v12.css' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V13 cleanup build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/LEGACY_CSS_V13_PAGES_VERIFIED.md <<EOF
          # Legacy CSS Cleanup V13 Pages verification

          - Astro production build: PASS
          - JavaScript syntax: PASS
          - V12 runtime stylesheet retained: PASS
          - V8/V9/V10/V11 legacy CSS files removed: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LEGACY_CSS_V13_PAGES_VERIFIED.md
          git commit -m 'Record successful Legacy CSS V13 Pages deployment'
          git push
