name: Verify Runtime V15 parity once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-runtime-v15-parity-once.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Checkout V15 candidate
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-selfcontained-v15-20260821
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build baseline
        working-directory: baseline
        run: |
          npm install
          npm run build
      - name: Build candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -s dist/pirate-deck-runtime-v15.css
          grep -q 'pirate-deck-runtime-v15.css' dist/index.html
          ! grep -q 'pirate-deck-runtime-v14.css' dist/index.html
          test "$(grep -c '^@import' public/pirate-deck-runtime-v15.css || true)" -eq 0
      - name: Install Playwright
        run: |
          mkdir -p qa && cd qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Compare rendered parity
        run: |
          set -euo pipefail
          mkdir -p .serve-base/pirate-deck .serve-candidate/pirate-deck
          cp -a baseline/dist/. .serve-base/pirate-deck/
          cp -a candidate/dist/. .serve-candidate/pirate-deck/
          python3 -m http.server 4173 --directory .serve-base >/tmp/pd-v14.log 2>&1 &
          P1=$!
          python3 -m http.server 4174 --directory .serve-candidate >/tmp/pd-v15.log 2>&1 &
          P2=$!
          trap 'kill $P1 $P2 || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('./qa/node_modules/playwright');
          const cases=[['iphone-se',375,667,true],['iphone',390,844,true],['tablet',768,1024,true],['desktop',1360,856,false]];
          const selectors=['.battle-hud','.boss-info-strip','.enemy-field.enemy-stage','.player-stage','.hand','.monster-card','.monster-cost','.monster-art-frame','.monster-name','.monster-effect','.monster-stats','.end','.character-health','.enemy-stage .slot','.player-field .slot'];
          const props=['display','position','width','height','minWidth','minHeight','maxWidth','maxHeight','paddingTop','paddingRight','paddingBottom','paddingLeft','marginTop','marginRight','marginBottom','marginLeft','gap','rowGap','columnGap','gridTemplateColumns','gridTemplateRows','alignItems','justifyContent','overflow','overflowX','overflowY','borderRadius','fontSize','lineHeight','color','backgroundColor','opacity','transform'];
          async function snapshot(port,width,height,mobile){
            const browser=globalThis.__browser;
            const ctx=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile});
            await ctx.addInitScript(()=>{localStorage.setItem('pirateDeckGuideSeen','1');localStorage.setItem('pirate-deck-guide-seen','1');});
            const page=await ctx.newPage();
            await page.goto(`http://127.0.0.1:${port}/pirate-deck/`,{waitUntil:'networkidle'});
            if(await page.locator('#start').isVisible().catch(()=>false)) await page.click('#start');
            if(await page.locator('#guideStart').isVisible().catch(()=>false)) await page.click('#guideStart');
            await page.waitForTimeout(300);
            const out=await page.evaluate(({selectors,props})=>{
              const result={};
              for(const s of selectors){
                const el=document.querySelector(s);
                if(!el){result[s]=null;continue;}
                const r=el.getBoundingClientRect(),cs=getComputedStyle(el),style={};
                for(const p of props)style[p]=cs[p];
                result[s]={rect:{x:r.x,y:r.y,w:r.width,h:r.height},style};
              }
              result.cardCount=document.querySelectorAll('.monster-card').length;
              result.endText=document.querySelector('#endTurn')?.textContent?.trim();
              result.bossText=document.querySelector('.hud-boss-name b')?.textContent?.trim();
              result.levelText=document.querySelector('.hud-boss-level b')?.textContent?.trim();
              return result;
            },{selectors,props});
            await ctx.close(); return out;
          }
          function compare(a,b,name){
            const errors=[];
            if(a.cardCount!==b.cardCount) errors.push(`${name}: cardCount differs`);
            for(const k of ['endText','bossText','levelText']) if(a[k]!==b[k]) errors.push(`${name}: ${k} differs`);
            for(const s of selectors){
              if(!a[s]||!b[s]){if(a[s]!==b[s])errors.push(`${name}: ${s} presence differs`);continue;}
              for(const k of ['x','y','w','h']) if(Math.abs(a[s].rect[k]-b[s].rect[k])>.6) errors.push(`${name}: ${s} rect ${k} differs`);
              for(const p of props) if(a[s].style[p]!==b[s].style[p]) errors.push(`${name}: ${s} ${p} differs`);
            }
            return errors;
          }
          (async()=>{
            globalThis.__browser=await chromium.launch({headless:true});
            const errors=[];
            for(const [name,w,h,mobile] of cases){
              const a=await snapshot(4173,w,h,mobile); const b=await snapshot(4174,w,h,mobile);
              const e=compare(a,b,name); console.log(name,e.length?'FAIL':'PASS'); errors.push(...e);
            }
            await globalThis.__browser.close();
            if(errors.length){console.error(errors.join('\n'));process.exit(1);}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Record parity result on feature
        working-directory: candidate
        run: |
          cat > docs/RUNTIME_V15_PARITY_VERIFIED.md <<'EOF'
          # Runtime CSS V15 parity verification

          - Baseline V14 Astro build: PASS
          - Candidate V15 Astro build: PASS
          - V15 has no @import dependencies: PASS
          - iPhone SE rendered parity: PASS
          - iPhone rendered parity: PASS
          - Tablet rendered parity: PASS
          - Desktop rendered parity: PASS
          - Gameplay JavaScript unchanged: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUNTIME_V15_PARITY_VERIFIED.md
          git commit -m 'Record Runtime V15 rendered parity'
          git push origin HEAD:feat/runtime-selfcontained-v15-20260821
