name: Verify and Deploy Monster Cards V2 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-monster-ui-v2-release-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monster-ui-v2-release
  cancel-in-progress: true

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        run: |
          set -euo pipefail
          npm install
          npm run build
      - name: Verify static output
        run: |
          set -euo pipefail
          test $(find dist/card-monsters -maxdepth 1 -name '0*-*.webp' | wc -l) -eq 8
          test -s dist/card-monsters/01-neri-meereskundschafter.webp
          test -s dist/card-monsters/08-moa-inselwaechter.webp
          grep -q '01-neri-meereskundschafter.webp' dist/pirate-deck-monster-cards-v1.js
          grep -q 'monster-art-img' dist/pirate-deck-monster-cards-v1.css
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run desktop and iPhone layout QA
        run: |
          set -euo pipefail
          mkdir -p .qa-root/pirate-deck
          cp -a dist/. .qa-root/pirate-deck/
          python3 -m http.server 4173 --directory .qa-root >/tmp/pirate-deck-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const cases = [
            { name: 'desktop', viewport: { width: 1360, height: 856 }, mobile: false },
            { name: 'iphone', viewport: { width: 390, height: 844 }, mobile: true }
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const test of cases) {
              const context = await browser.newContext({ viewport: test.viewport, isMobile: test.mobile, hasTouch: test.mobile });
              await context.addInitScript(() => localStorage.setItem('pirateDeckGuideSeen', '1'));
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/pirate-deck/', { waitUntil: 'networkidle' });
              await page.click('#start');
              await page.waitForTimeout(350);
              const result = await page.evaluate(() => {
                const rect = el => el.getBoundingClientRect();
                const cards = [...document.querySelectorAll('.monster-card')];
                const end = document.querySelector('#endTurn');
                const boss = document.querySelector('.boss-stage');
                const images = [...document.querySelectorAll('.monster-card .monster-art-img')];
                const costVisible = cards.every(card => {
                  const cost = card.querySelector('.monster-cost');
                  if (!cost) return false;
                  const c = rect(card), r = rect(cost);
                  return r.width > 25 && r.height > 20 && r.left >= c.left - 1 && r.top >= c.top - 1 && r.right <= c.right + 1;
                });
                const statsVisible = cards.every(card => {
                  const atk = card.querySelector('.monster-attack strong');
                  const def = card.querySelector('.monster-defense strong');
                  if (!atk || !def) return false;
                  const a = rect(atk), d = rect(def), c = rect(card);
                  return a.width > 0 && d.width > 0 && a.bottom <= c.bottom && d.bottom <= c.bottom;
                });
                const noEndOverlap = cards.every(card => {
                  const a = rect(card), b = rect(end);
                  return a.bottom <= b.top + 1 || a.top >= b.bottom - 1 || a.right <= b.left + 1 || a.left >= b.right - 1;
                });
                return {
                  cardCount: cards.length,
                  imagesLoaded: images.length === cards.length && images.every(img => img.complete && img.naturalWidth > 0),
                  costVisible,
                  statsVisible,
                  noEndOverlap,
                  endBottom: rect(end).bottom,
                  viewportHeight: innerHeight,
                  bossHeight: rect(boss).height,
                  statFont: parseFloat(getComputedStyle(cards[0].querySelector('.monster-attack strong')).fontSize),
                  cardNameFont: parseFloat(getComputedStyle(cards[0].querySelector('.monster-name strong')).fontSize)
                };
              });
              assert(result.cardCount === 4, `${test.name}: expected 4 hand cards, got ${result.cardCount}`);
              assert(result.imagesLoaded, `${test.name}: monster images did not all load`);
              assert(result.costVisible, `${test.name}: at least one cost badge is clipped`);
              assert(result.statsVisible, `${test.name}: attack/defense values are clipped`);
              assert(result.noEndOverlap, `${test.name}: cards overlap end-turn button`);
              assert(result.endBottom <= result.viewportHeight + 2, `${test.name}: end-turn button requires initial scrolling (${result.endBottom}/${result.viewportHeight})`);
              assert(result.bossHeight <= 145, `${test.name}: boss area too tall (${result.bossHeight}px)`);
              assert(result.statFont >= 12, `${test.name}: combat stat font too small (${result.statFont}px)`);
              assert(result.cardNameFont >= 10.5, `${test.name}: monster name font too small (${result.cardNameFont}px)`);
              console.log(`${test.name} QA PASS`, result);
              await context.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build-and-qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record verified release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/MONSTER_UI_V2_RELEASE_VERIFIED.md <<EOF
          # Monster Cards V2 release verification

          - Astro production build: PASS
          - 8 individual monster WebP assets in build: PASS
          - Desktop 1360x856 layout QA: PASS
          - iPhone 390x844 layout QA: PASS
          - Card costs visible: PASS
          - Attack / defense values visible: PASS
          - No card / end-turn overlap: PASS
          - End-turn reachable without initial scroll: PASS
          - Compact boss area: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MONSTER_UI_V2_RELEASE_VERIFIED.md
          git commit -m 'Record verified Monster Cards V2 release'
          git push
