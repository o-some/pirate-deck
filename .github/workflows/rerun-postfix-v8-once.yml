name: Trigger post-fix QA V8 once

on:
  push:
    branches: [feat/live-qa-v8-20260821]
    paths:
      - '.github/workflows/rerun-postfix-v8-once.yml'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger post-fix diagnostic
        run: |
          printf '\n# retry-postfix\n' >> .github/workflows/diagnose-live-qa-v8-postfix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/diagnose-live-qa-v8-postfix-once.yml
          git commit -m 'Rerun post-fix Live QA V8'
          git push
