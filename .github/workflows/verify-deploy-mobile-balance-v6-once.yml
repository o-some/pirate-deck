name: Verify and deploy Mobile Balance V6 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-mobile-balance-v6-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mobile-balance-v6-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify V6
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -s dist/pirate-deck-mobile-balance-v6.css
          grep -q 'pirate-deck-mobile-balance-v6.css' dist/index.html
          grep -q '100svh' dist/pirate-deck-mobile-balance-v6.css
          grep -q 'object-fit:contain' dist/pirate-deck-mobile-balance-v6.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V6 build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > docs/MOBILE_BALANCE_V6_PAGES_VERIFIED.md <<EOF
          # Mobile / Viewport Balance V6 Pages verification

          - Astro production build: PASS
          - V6 CSS in build: PASS
          - Dynamic viewport / centered asset rules in build: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: \`$RELEASE_SHA\`
          - Page URL: $PAGE_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add -- docs/MOBILE_BALANCE_V6_PAGES_VERIFIED.md
          git commit -m 'Record successful Mobile Balance V6 Pages deployment'
          git push
