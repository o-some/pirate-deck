name: Verify and deploy Asset Integrity V22 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-asset-integrity-v22-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify guards and production build
        run: |
          set -euo pipefail
          node --check scripts/verify-runtime-sources.mjs
          node --check scripts/verify-style-sources.mjs
          node --check scripts/verify-asset-integrity.mjs
          npm run build
          test -s dist/pirate-deck-foundation-v17.css
          test -s dist/pirate-deck-runtime-v15.css
          test -s dist/pirate-deck-ui-runtime-v18.js
          test ! -e dist/card-monsters/monster-sprites-v1.webp
          test "$(find dist/bosses -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 10
          test "$(find dist/card-monsters -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 8
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record successful release
        run: |
          cat > docs/ASSET_INTEGRITY_V22_PAGES_VERIFIED.md <<'EOF'
          # Asset Integrity Guard V22 Pages verification

          - Runtime source guard: PASS
          - Style source guard: PASS
          - Asset integrity guard: PASS
          - Astro production build: PASS
          - 10 boss runtime images: PASS
          - 8 monster runtime images: PASS
          - Obsolete monster sprite sheet absent: PASS
          - GitHub Pages deployment: PASS
          - Release SHA: `d07752661de2f17154b72fad51ff0563a998cd08`
          - Page URL: https://o-some.github.io/pirate-deck/
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ASSET_INTEGRITY_V22_PAGES_VERIFIED.md
          git commit -m 'Record Asset Integrity V22 Pages deployment'
          git push

# retry-trigger
