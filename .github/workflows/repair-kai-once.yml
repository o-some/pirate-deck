name: Repair Pirat Kai asset once

on:
  push:
    paths:
      - '.github/workflows/repair-kai-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace local Kai with known-good Tula asset
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://raw.githubusercontent.com/o-some/tulasisland/main/public/letter-bay/bosses/level-01-pirat-kai.webp' -o public/bosses/level-01-pirat-kai.webp
          test -s public/bosses/level-01-pirat-kai.webp
      - name: Verify image signature and Astro build
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/bosses/level-01-pirat-kai.webp')
          b=p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', 'Kai is not a valid WebP container'
          print('Kai WebP OK', len(b), 'bytes')
          PY
          npm install
          npm run build
          test -s dist/bosses/level-01-pirat-kai.webp
      - name: Commit repaired Kai
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bosses/level-01-pirat-kai.webp
          git commit -m 'Repair local Pirat Kai sprite from canonical Tula asset' || exit 0
          git push
