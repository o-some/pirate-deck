name: Diagnose Hand 7 V5 once

on:
  push:
    branches: [feat/hand7-cards-v5-20260821]
    paths:
      - '.github/workflows/verify-hand7-v5-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          set -euo pipefail
          node --check public/pirate-deck-hand7-v5.js
          npm install
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture layout metrics
        run: |
          set -euo pipefail
          mkdir -p .qa-root/pirate-deck docs
          cp -a dist/. .qa-root/pirate-deck/
          python3 -m http.server 4173 --directory .qa-root >/tmp/hand7-diagnostic.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const cases = [
            { name:'desktop', viewport:{width:1360,height:900}, mobile:false },
            { name:'iphone', viewport:{width:390,height:844}, mobile:true }
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report={};
            for(const test of cases){
              const context=await browser.newContext({viewport:test.viewport,isMobile:test.mobile,hasTouch:test.mobile});
              await context.addInitScript(()=>localStorage.setItem('pirateDeckGuideSeen','1'));
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/pirate-deck/',{waitUntil:'networkidle'});
              await page.click('#start');
              await page.waitForTimeout(250);
              if(await page.locator('#gameGuide').evaluate(el=>el.classList.contains('open') || el.getAttribute('aria-hidden')==='false').catch(()=>false)){
                await page.locator('#guideStart').click().catch(()=>{});
                await page.waitForTimeout(150);
              }
              report[test.name]=await page.evaluate(()=>{
                const rect=el=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,right:r.right,bottom:r.bottom,left:r.left};};
                const cards=[...document.querySelectorAll('.monster-card')];
                const host=document.querySelector('#cards');
                const end=document.querySelector('#endTurn');
                return {
                  viewport:{width:innerWidth,height:innerHeight},
                  handCounter:document.querySelector('#handCount')?.textContent?.trim()||null,
                  count:cards.length,
                  host:{clientWidth:host?.clientWidth||0,scrollWidth:host?.scrollWidth||0},
                  end:end?rect(end):null,
                  cards:cards.map((card,index)=>{
                    const q=s=>card.querySelector(s);
                    const cost=q('.monster-cost'),art=q('.monster-art-frame'),name=q('.monster-name'),effect=q('.monster-effect'),stats=q('.monster-stats'),hint=q('.monster-play-hint'),img=q('.monster-art-img');
                    const boxes={card:rect(card),cost:rect(cost),art:rect(art),name:rect(name),effect:rect(effect),stats:rect(stats),hint:rect(hint)};
                    return {
                      index,
                      disabled:card.disabled,
                      opacity:parseFloat(getComputedStyle(card).opacity),
                      imageLoaded:!!img&&img.complete&&img.naturalWidth>0,
                      boxes,
                      gaps:{nameEffect:boxes.effect.top-boxes.name.bottom,effectStats:boxes.stats.top-boxes.effect.bottom,statsHint:boxes.hint.top-boxes.stats.bottom},
                      costInside:boxes.cost.left>=boxes.card.left-1&&boxes.cost.top>=boxes.card.top-1&&boxes.cost.right<=boxes.card.right+1,
                      endGap:end?rect(end).top-boxes.card.bottom:null
                    };
                  })
                };
              });
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('docs/HAND7_V5_METRICS.json',JSON.stringify(report,null,2));
          })().catch(err=>{
            fs.writeFileSync('docs/HAND7_V5_METRICS.json',JSON.stringify({error:String(err),stack:err.stack},null,2));
          });
          NODE
      - name: Commit metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/HAND7_V5_METRICS.json
          git commit -m 'Record Hand 7 V5 layout metrics' || exit 0
          git push
