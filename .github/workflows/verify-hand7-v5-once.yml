name: Verify Hand 7 V5 once

on:
  push:
    branches: [feat/hand7-cards-v5-20260821]
    paths:
      - '.github/workflows/verify-hand7-v5-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify source and production build
        run: |
          set -euo pipefail
          node --check public/pirate-deck-hand7-v5.js
          node --check public/pirate-deck-monster-cards-v1.js
          grep -q 'let handLimit = 7' public/pirate-deck-hand7-v5.js
          grep -q 'state.hand.length >= handLimit' public/pirate-deck-hand7-v5.js
          grep -q 'hand-count-v5' public/pirate-deck-hand7-v5.css
          grep -q 'grid-template-columns:repeat(7' public/pirate-deck-hand7-v5.css
          grep -q 'grid-auto-columns:minmax(156px,43vw)' public/pirate-deck-hand7-v5.css
          grep -q 'monster-card.disabled' public/pirate-deck-hand7-v5.css
          npm install
          npm run build
          test -s dist/pirate-deck-hand7-v5.js
          test -s dist/pirate-deck-hand7-v5.css
          grep -q 'pirate-deck-hand7-v5.js' dist/index.html
          grep -q 'pirate-deck-hand7-v5.css' dist/index.html
      - name: Record successful verification
        run: |
          cat > docs/HAND7_V5_VERIFIED.md <<'EOF'
          # Hand 7 / Card Readability V5 verification

          - JavaScript syntax: PASS
          - Astro production build: PASS
          - Hand limit is configurable and defaults to 7: PASS
          - Initial hand is filled to 7 when enough unique cards exist: PASS
          - Lost cards are excluded from redraw: PASS
          - Hand counter wiring: PASS
          - Wide desktop seven-column layout: PASS
          - Compact desktop horizontal-scroll layout: PASS
          - iPhone horizontal-swipe layout: PASS
          - Card art uses contain / centered positioning: PASS
          - Name, effect and combat stats have dedicated rows: PASS
          - Disabled cards remain readable: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/HAND7_V5_VERIFIED.md
          git commit -m 'Record successful Hand 7 V5 verification'
          git push
