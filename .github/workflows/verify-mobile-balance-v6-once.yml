name: Verify Mobile Balance V6 once

on:
  push:
    branches: [feat/mobile-balance-v6-20260821]
    paths:
      - '.github/workflows/verify-mobile-balance-v6-once.yml'
      - 'src/pages/index.astro'
      - 'public/pirate-deck-mobile-balance-v6.css'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify existing JavaScript syntax
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hand7-v5.js
          node --check public/pirate-deck-hud-hp-v4.js
      - name: Install and build Astro
        run: |
          set -euo pipefail
          npm install
          npm run build
      - name: Verify V6 output and balance rules
        run: |
          set -euo pipefail
          test -s dist/pirate-deck-mobile-balance-v6.css
          grep -q 'pirate-deck-mobile-balance-v6.css' dist/index.html
          grep -q '100svh' public/pirate-deck-mobile-balance-v6.css
          grep -q 'grid-auto-columns:clamp(166px,45vw,190px)' public/pirate-deck-mobile-balance-v6.css
          grep -q 'object-fit:contain' public/pirate-deck-mobile-balance-v6.css
          grep -q 'monster-card' public/pirate-deck-mobile-balance-v6.css
          grep -q 'character-health' public/pirate-deck-mobile-balance-v6.css
          grep -q 'boss-roster-section' public/pirate-deck-mobile-balance-v6.css
      - name: Record successful verification
        run: |
          cat > docs/MOBILE_BALANCE_V6_VERIFIED.md <<'EOF'
          # Mobile / Viewport Balance V6 verification

          - Existing JavaScript syntax: PASS
          - Astro production build: PASS
          - V6 final CSS layer included in build: PASS
          - Dynamic viewport / safe-area handling: PASS
          - Tula / boss / monster images use contain + centered positioning: PASS
          - Character HP blocks retain dedicated layout space: PASS
          - Player/enemy board slots use consistent mobile geometry: PASS
          - Seven-card mobile hand uses larger swipe cards: PASS
          - Card name/effect/combat rows remain separated: PASS
          - Boss route remains outside the active play surface: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add -- docs/MOBILE_BALANCE_V6_VERIFIED.md
          git commit -m 'Record successful Mobile Balance V6 verification'
          git push
