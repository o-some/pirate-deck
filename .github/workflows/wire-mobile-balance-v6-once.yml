name: Wire Mobile Balance V6 once

on:
  push:
    branches: [feat/mobile-balance-v6-20260821]
    paths:
      - '.github/workflows/wire-mobile-balance-v6-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire final V6 stylesheet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/index.astro')
          text = path.read_text()
          anchor = '  <link rel="stylesheet" href={`${base}pirate-deck-hand7-v5.css`} />\n'
          line = '  <link rel="stylesheet" href={`${base}pirate-deck-mobile-balance-v6.css`} />\n'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('hand7 CSS anchor missing')
              text = text.replace(anchor, anchor + line, 1)
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add -- src/pages/index.astro
          git commit -m 'Wire viewport balance V6 stylesheet' || exit 0
          git push
