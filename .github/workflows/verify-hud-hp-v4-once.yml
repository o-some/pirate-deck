name: Verify HUD HP V4 once

on:
  push:
    branches: [feat/hud-hp-v4-20260821]
    paths:
      - '.github/workflows/verify-hud-hp-v4-once.yml'
      - 'src/pages/index.astro'
      - 'public/pirate-deck-hud-hp-v4.css'
      - 'public/pirate-deck-hud-hp-v4.js'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify JavaScript syntax
        run: |
          set -euo pipefail
          node --check public/pirate-deck.js
          node --check public/pirate-deck-monster-cards-v1.js
          node --check public/pirate-deck-hud-hp-v4.js
      - name: Install and build Astro
        run: |
          set -euo pipefail
          npm install
          npm run build
      - name: Verify HUD HP V4 wiring
        run: |
          set -euo pipefail
          test -s dist/pirate-deck-hud-hp-v4.css
          test -s dist/pirate-deck-hud-hp-v4.js
          grep -q 'pirate-deck-hud-hp-v4.css' dist/index.html
          grep -q 'pirate-deck-hud-hp-v4.js' dist/index.html
          grep -q 'id="playerHp"' dist/index.html
          grep -q 'id="playerHpBar"' dist/index.html
          grep -q 'id="bossHpText"' dist/index.html
          grep -q 'id="bossHp"' dist/index.html
          grep -q 'bossTitle' public/pirate-deck-hud-hp-v4.js
          grep -q 'bossProgressText' public/pirate-deck-hud-hp-v4.js
      - name: Record successful verification
        run: |
          cat > docs/HUD_HP_V4_VERIFIED.md <<'EOF'
          # HUD / Character HP V4 verification

          - JavaScript syntax: PASS
          - Astro production build: PASS
          - Tula HP keeps existing render IDs: PASS
          - Boss HP keeps existing render IDs: PASS
          - Character HP relocation layer included: PASS
          - Boss name / level sync layer included: PASS
          - Mobile responsive CSS included: PASS
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HUD_HP_V4_VERIFIED.md
          git commit -m 'Record successful HUD HP V4 verification'
          git push
