name: Import Monster Card Assets Once

on:
  push:
    branches: [feat/monster-ui-fix-20260821]
    paths:
      - '.github/workflows/import-monster-assets-once.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Download source PNGs from Dropbox temporary links
        run: |
          set -euo pipefail
          mkdir -p .tmp-monsters public/card-monsters
          curl --fail --location --silent --show-error 'https://ucdbbc76d6461bf9ec332e1cb56b.dl.dropboxusercontent.com/cd/0/get/DGk2vZ3pWsB9JQOhUWxsD6mDeh26DdxSb_QUiB4kxfhR8k48KCeSBNcCan2MWs5Lq8ooJSwny62E3ENYn3iQDOCQO9h4rl5eqgqR_jBy9IK9kwNsur_tyPFrvl7Flf79TbaFGEaWoy_jMnUtph7_lptDSKXMj2tvCdWJvNcLkTIMAw/file?c_luid=88361d58' -o .tmp-monsters/01.png
          curl --fail --location --silent --show-error 'https://uc26fd57b59b4048309d284d1351.dl.dropboxusercontent.com/cd/0/get/DGnkzDe05DfvSWSqjSUGEER0Mfd8nc_iQ3ejyB3ajn0J38RFd9y-ot4NyTxukx6SHrV0s5c1Bgd8mdKUtsk5Y0G5zrBrPAMhr5GOLsSXyfC5HHvDHaUfyIurAV_dwE8ms8ub2MSm7zJmYMwnsxxYxPMogzQaeA1K55GTDE2U72ipJQ/file?c_luid=88361d58' -o .tmp-monsters/02.png
          curl --fail --location --silent --show-error 'https://uce30e199d7cbcc6543514c486b2.dl.dropboxusercontent.com/cd/0/get/DGmsA0uO7WM4t5xWzeGV9-qZjRD6cdNYlZZk90xnu1tm_20C3AiSMJN7SnxCgt3WWeNcfM_H4OmUn7NusWNyYWcfBbePp9-orOSFJGkhf1D62bH5AggGzrqnrscpd7NDI0FR2TIcYDFgL1JqsNdHaSIMAX5y0jcawItPsfCeXBpp5Q/file?c_luid=88361d58' -o .tmp-monsters/03.png
          curl --fail --location --silent --show-error 'https://uc1f32dfb924a4be563350653853.dl.dropboxusercontent.com/cd/0/get/DGnvNEn5IGnpMWntWzq8IMPxiyCrtrBQGnMagfDMAtkN1OtYu6ItTV97bx80tusOLqeQlXV0JbrWgurc78eyDokX6DY-FomR7A79fUXNcVhAvS3AhSaw5bRM6LS4xHh-f-VtHusygiqJ7-lnivK0_cHlvgxBLLFU_PBhNlRNoE1-qA/file?c_luid=88361d58' -o .tmp-monsters/04.png
          curl --fail --location --silent --show-error 'https://uc738974c47c9d910eba8f1fbc35.dl.dropboxusercontent.com/cd/0/get/DGl9bSyl1DODQWxXMcJYyGPkr3Gl1S5I98R0qRtZ1ob7uWY9WBbDowKgqY0W2_lW-YqcPlOpl4EOzgpLvwMMY0CFAsqBfKGM1wKxZF6wV7zo7T4p4T2kcKA86s-WHghSfObiHT-yccHPptYy53pP4XS0nRB197NnFl-eNCNt4n6O5Q/file?c_luid=88361d58' -o .tmp-monsters/05.png
          curl --fail --location --silent --show-error 'https://uc01cac5850c30b315579fda467f.dl.dropboxusercontent.com/cd/0/get/DGnRzc1BdjBuN2AXX0q_6NHlA-4nymPiFtGYqPeAiUrJpFSYjeQrt10KsdYDfXc_T_1Pe2CStznCfKjkEUyAWgsP_Q0hSWziIiJv12hWNt9xYlkqa6Y2-P3-VQqC-V6tro9HSuM0XtjxhKdFKZEB0XsCXs5pRdewhlo2s-Gmw2zCkw/file?c_luid=88361d58' -o .tmp-monsters/06.png
          curl --fail --location --silent --show-error 'https://uce7d9e99cc733a0ad5497650213.dl.dropboxusercontent.com/cd/0/get/DGl8d4kJ-svlMECXtbRW6_Hr-X22fctkYAOkraxXXR5qVNMjlYN8mAqfEza9afroJteggh4nDFupXDNzqQfc1h6O68y1v7FKZ_VhRCr_KRyfQC6QdYIX4wi3vkXNrrSCYmZqHp6OdE5JQOVxwJybLxewBGYRcp3HefKiKjv-UHWnqg/file?c_luid=88361d58' -o .tmp-monsters/07.png
          curl --fail --location --silent --show-error 'https://uc426554892491599891d4c3a5b0.dl.dropboxusercontent.com/cd/0/get/DGlMeE8n7l3mvuAli5lAtKAI-f_OFSVPGPOgu_uAVHLRzjmMLSuIVIRrsUu8IYX5ZvhXD58G7YY3ttyJDopKa1tUifMj7AkTgbEVJzKnbhcSpIFRf1gDIswyS9QC4ns_0YtcSQ8xic_Gt4H45o42uUG-axrlWWTg2wovnHH5RRNGwA/file?c_luid=88361d58' -o .tmp-monsters/08.png
      - name: Optimize to local WebP card assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names = [
            '01-neri-meereskundschafter.webp',
            '02-pompi-apfelgeist.webp',
            '03-wavi-wellengeist.webp',
            '04-mira-herzhueterin.webp',
            '05-soli-sonnengeist.webp',
            '06-lexi-runengelehrter.webp',
            '07-krax-sprintkrabbler.webp',
            '08-moa-inselwaechter.webp',
          ]
          for i, name in enumerate(names, 1):
              im = Image.open(f'.tmp-monsters/{i:02}.png').convert('RGBA')
              im.thumbnail((640, 640), Image.Resampling.LANCZOS)
              im.save(Path('public/card-monsters') / name, 'WEBP', quality=82, method=6)
          PY
          rm -rf .tmp-monsters
      - name: Verify assets
        run: |
          set -euo pipefail
          test $(find public/card-monsters -maxdepth 1 -name '0*-*.webp' | wc -l) -eq 8
          test -s public/card-monsters/01-neri-meereskundschafter.webp
          test -s public/card-monsters/08-moa-inselwaechter.webp
      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/card-monsters/*.webp
          git commit -m 'Add individual optimized monster card assets'
          git push
