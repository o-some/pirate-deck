name: Verify and deploy Release Integrity V24 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-release-integrity-v24-once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify release integrity and production build
        run: |
          set -euo pipefail
          node --check scripts/verify-release-integrity.mjs
          rm .github/workflows/verify-deploy-release-integrity-v24-once.yml
          npm run build
          node scripts/verify-release-integrity.mjs
          test -s dist/pirate-deck-foundation-v17.css
          test -s dist/pirate-deck-runtime-v15.css
          test -s dist/pirate-deck-ui-runtime-v18.js
          test "$(grep -o '<script ' dist/index.html | wc -l)" -eq 4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record successful release
        run: |
          cat > docs/RELEASE_INTEGRITY_V24_PAGES_VERIFIED.md <<'EOF'
          # Release Integrity V24 Pages verification

          - Runtime source guard V20: PASS via production build
          - Style source guard V21: PASS via production build
          - Asset integrity guard V22: PASS via production build
          - Accessibility V23 source retained in UI runtime: PASS
          - Release integrity V24 guard: PASS
          - Astro production build: PASS
          - Runtime script count remains 4: PASS
          - GitHub Pages deployment: PASS
          - Release code SHA: `1b96ba49f573bde44fae52e988733fd2d0e9b01b`
          - Page URL: https://o-some.github.io/pirate-deck/
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RELEASE_INTEGRITY_V24_PAGES_VERIFIED.md
          git commit -m 'Record Release Integrity V24 Pages deployment'
          git push
